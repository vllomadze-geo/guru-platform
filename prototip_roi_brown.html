  <style>

nmax(150px,1fr) minmax(175px,1.15fr);gap:10px;min-width:1090px}.material-plane .field{margin:0}.material-plane .field>span,.material-result>span{font-size:12px}.material-result{display:block}.material-result>span{display:block;font-weight:700;margin-bottom:5px}.material-result .result{height:42px;padding:9px 10px;white-space:nowrap}.material-result .result b{font-size:15px}.material-formulas{display:grid;gap:4px;padding:0 14px 10px}.material-formulas .formula{margin:0}.row-actions{margin:10px 0}.btn{display:block;width:100%;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:10px 12px;cursor:pointer;margin:8px 0}.btn.secondary{background:#fff;color:var(--accent)}.btn.danger{border-color:#b94c4c;color:#922c2c;background:#fff}.remove{font-size:13px;padding:7px 10px}.unit-combo{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;height:42px}.unit-combo input{border:0;border-radius:0;min-width:0}.unit-combo select{width:78px;border:0;border-left:1px solid var(--line);border-radius:0;padding:4px}.notice{padding:11px 12px;border-radius:9px;background:var(--warn);border:1px solid #e5cc76;margin:10px 0}.notice.error{background:var(--danger);border-color:#ddaaaa;color:#6e2020}.metric{margin:10px 0}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:18px}.status{font-weight:700;padding:12px;border-radius:9px;background:var(--accent-soft);color:#174634}.status.bad{background:var(--danger);color:var(--error)}.tableless{border-top:1px solid var(--line);margin-top:10px}.sensitivity{padding:9px 0;border-bottom:1px solid var(--line)}.sensitivity b{display:block}.file-input{display:none}@media(max-width:560px){.app{padding:18px 10px}.block{padding:16px}.intro h1{font-size:24px}.material-plane-wrap{padding:12px}.material-plane{min-width:960px}.material-card-head{padding:10px 12px}.material-formulas{padding:0 12px 10px}}@media print{body{background:#fff}.app{max-width:none;padding:0}.block{box-shadow:none}.btn,.remove,.no-print{display:none!important}.block{break-inside:avoid}}
    body.embedded{background:#fff}.embedded .app{max-width:none;width:100%;margin:0;padding:18px 20px 32px}.embedded .intro{margin:0 0 14px}.embedded .intro h1{font-size:24px}.embedded .block{margin:12px 0}.entity-card{padding:0;overflow:hidden}.entity-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfa}.entity-card-head h4{margin:0}.entity-card-head .remove{display:inline-block;width:auto;margin:0}.entity-plane-wrap{overflow-x:auto;padding:14px}.entity-plane{display:grid;gap:10px;min-width:860px}.entity-plane .field{margin:0}.entity-plane .field>span{font-size:12px}.entity-plane .result{height:42px;padding:9px 10px;white-space:nowrap}.entity-plane .result b{font-size:15px}.entity-plane-3{grid-template-columns:minmax(180px,1.4fr) minmax(170px,1fr) minmax(180px,1fr)}.entity-plane-4{grid-template-columns:minmax(180px,1.25fr) minmax(160px,1fr) minmax(145px,.9fr) minmax(180px,1fr)}.entity-plane-5{grid-template-columns:minmax(180px,1.3fr) minmax(150px,1fr) minmax(145px,.9fr) minmax(145px,.9fr) minmax(180px,1fr)}.entity-plane-6{grid-template-columns:minmax(170px,1.25fr) minmax(155px,1fr) minmax(155px,1fr) minmax(135px,.85fr) minmax(130px,.85fr) minmax(180px,1fr)}.entity-formulas{display:grid;gap:4px;padding:0 14px 10px}.entity-formulas .formula{margin:0}.period-range{display:grid;grid-template-columns:minmax(190px,1fr) minmax(190px,1fr);gap:10px}.period-range .field{margin:0}.simple-text{margin:6px 0 14px;color:var(--muted);font-size:13px}.simple-price.error .result{background:var(--danger);border-color:#ddaaaa;color:var(--error)}.simple-ok{background:#edf7f0;border-color:#b7d8c0;color:#174634}@media(max-width:560px){.embedded .app{padding:14px 12px 24px}.embedded .intro h1{font-size:21px}.entity-plane-wrap{padding:12px}.entity-plane{min-width:760px}.entity-card-head{padding:10px 12px}.entity-formulas{padding:0 12px 10px}.period-range{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="app">
  <header class="intro"><h1>Окончательная цена по Брауну</h1></header>
  <div id="calculator"></div>
</main>
<input id="importFile" class="file-input" type="file" accept="application/json,.json">
<script>
(() => {
  const params=new URLSearchParams(location.search), calculatorKey=params.get('key'), embedded=params.get('embed')==='1';
  if(embedded)document.body.classList.add('embedded');
  function reportEmbedHeight(){if(!embedded)return;const h=Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight));window.parent.postMessage({type:'guru-brown-calculator-height',height:h},location.origin)}
  // Родитель читает средний чек и маржинальность для сквозного прогноза (Gate 8),
  // поэтому при каждом пересчёте сообщаем ему актуальную цену и маржу после комиссий.
  function reportEmbedData(c){if(!embedded)return;const aov=n(state.pricing.actual)||c.recommended,marginPercent=Number.isFinite(c.markupMargin)?c.markupMargin*100:0;window.parent.postMessage({type:'guru-brown-calculator-data',key:calculatorKey||'',aov,marginPercent},location.origin)}
  if(embedded&&window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(reportEmbedHeight)).observe(document.documentElement);
  const KEY='brown-roi-calculator-v1'+(calculatorKey?':'+calculatorKey:''), units=['м','м²','кг','г','л','мл','шт.','уп.'];
  const UNIT_META={м:{group:'length',factor:1},'м²':{group:'area',factor:1},кг:{group:'mass',factor:1},г:{group:'mass',factor:.001},л:{group:'volume',factor:1},мл:{group:'volume',factor:.001},'шт.':{group:'piece',factor:1},'уп.':{group:'pack',factor:1}};
  const clone=x=>JSON.parse(JSON.stringify(x));
  const demo={business:{period:'month',periodStart:'2026-01-01',periodEnd:'2026-01-31',volume:40,equipment:150000,wip:10000,receivables:0,otherAssets:0,payables:0,advances:0},materials:[{id:'m1',name:'Ткань',cost:5860,qty:4.95,unit:'м',start:2,end:2.5}],labor:[{id:'l1',name:'Мастер',cost:96000,hours:160}],budgets:[{id:'b1',name:'Реклама',category:'Реклама и продажи',amount:20000}],product:{name:'Авторское изделие',type:'product',baseMaterials:[{id:'bm1',materialId:'m1',usage:1,usageUnit:'м',loss:0}],work:[{id:'w1',laborId:'l1',hours:3}],extraMaterials:[],individual:[],qualityLoss:0},pricing:{markup:100,fees:0,round:100,actual:''}};
  let state=load(), uid=Date.now();
  function ensurePeriodRange(){const b=state.business||(state.business={});if(!b.periodStart)b.periodStart='2026-01-01';if(!b.periodEnd)b.periodEnd=b.period==='year'?'2026-12-31':b.period==='quarter'?'2026-03-31':'2026-01-31'}
  ensurePeriodRange();
  function ensurePricing(){const p=state.pricing||(state.pricing={}),num=v=>Math.max(0,Number(String(v??'').replace(',','.'))||0);p.fees=Math.min(95,num(p.fees));p.markup=num(p.markup)||100;if(p.actual===0)p.actual='';if(![10,50,100,500].includes(num(p.round)))p.round=100}
  ensurePricing();
  if(!localStorage.getItem(KEY)&&params.get('name')) state.product.name=params.get('name');
  const id=p=>p+'-'+(++uid);
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return valid(s)?s:clone(demo)}catch{return clone(demo)}}
  function valid(s){return s&&s.business&&Array.isArray(s.materials)&&Array.isArray(s.labor)&&Array.isArray(s.budgets)&&s.product&&s.pricing}
  const n=v=>Math.max(0,Number(String(v??'').replace(',','.'))||0);
  const pct=(v,max=95)=>Math.min(max,n(v))/100;
  // Денежные значения не округляются в расчётах: форматирование применяется
  // только на экране и всегда сохраняет две десятичные позиции.
  const money=v=>Number.isFinite(v)?Number(v).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽':'—';
  const number=v=>Number.isFinite(v)?v.toLocaleString('ru-RU',{maximumFractionDigits:2}):'—';
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const dateMs=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return NaN;const ms=Date.UTC(+m[1],+m[2]-1,+m[3]),d=new Date(ms);return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[3]?ms:NaN};
  const periodDays=()=>{const start=dateMs(state.business.periodStart),end=dateMs(state.business.periodEnd);return Number.isFinite(start)&&Number.isFinite(end)&&end>=start?Math.floor((end-start)/86400000)+1:0};
  const periodFactor=()=>periodDays()?365/periodDays():0;
  function calc(){
    const b=state.business,p=state.product,pr=state.pricing,volume=n(b.volume),annual=volume*periodFactor();
    const mats=state.materials.map(m=>({...m,unitCost:n(m.cost)/(n(m.qty)||Infinity),avgQty:(n(m.start)+n(m.end))/2})).map(m=>({...m,capital:m.avgQty*m.unitCost}));
    const labor=state.labor.map(x=>({...x,hourCost:n(x.cost)/(n(x.hours)||Infinity)}));
    const totalBuy=mats.reduce((s,x)=>s+n(x.cost),0), inventory=mats.reduce((s,x)=>s+x.capital,0), budgetTotal=state.budgets.reduce((s,x)=>s+n(x.amount),0), budgetPer=budgetTotal/(volume||Infinity);
    const base=p.baseMaterials.map(x=>{const m=mats.find(y=>y.id===x.materialId),purchaseUnit=m?.unit||'шт.',purchaseMeta=UNIT_META[purchaseUnit],isArea=purchaseMeta?.group==='area',selectedUsageUnit=isArea?'м²':(x.usageUnit||purchaseUnit),selectedMeta=UNIT_META[selectedUsageUnit],usageUnit=selectedMeta&&purchaseMeta&&selectedMeta.group===purchaseMeta.group?selectedUsageUnit:purchaseUnit,from=UNIT_META[usageUnit],to=UNIT_META[purchaseUnit],rawUsage=isArea?n(x.width)*n(x.length):n(x.usage),usageInPurchaseUnit=rawUsage*from.factor/to.factor,used=usageInPurchaseUnit/(1-pct(x.loss)||.05);return {...x,m,purchaseUnit,isArea,usageUnit,rawUsage,usageInPurchaseUnit,used,value:(m?.unitCost||0)*used}});
    const work=p.work.map(x=>{const l=labor.find(y=>y.id===x.laborId);return {...x,l,value:(l?.hourCost||0)*n(x.hours)}});
    const extra=p.extraMaterials.map(x=>{const cost=n(x.cost)/(n(x.qty)||Infinity),selectedUsageUnit=x.usageUnit||x.unit,selectedMeta=UNIT_META[selectedUsageUnit],purchaseMeta=UNIT_META[x.unit],usageUnit=selectedMeta&&purchaseMeta&&selectedMeta.group===purchaseMeta.group?selectedUsageUnit:x.unit,from=UNIT_META[usageUnit],to=UNIT_META[x.unit],usageInPurchaseUnit=n(x.usage)*from.factor/to.factor,used=usageInPurchaseUnit/(1-pct(x.loss)||.05);return {...x,unitCost:cost,usageUnit,usageInPurchaseUnit,used,value:cost*used}});
    const mainCost=base.reduce((s,x)=>s+x.value,0),workCost=work.reduce((s,x)=>s+x.value,0),extraCost=extra.reduce((s,x)=>s+x.value,0),individual=p.individual.reduce((s,x)=>s+n(x.amount),0),quality=n(p.qualityLoss),full=mainCost+workCost+budgetPer+extraCost+individual+quality;
    const fee=pct(pr.fees),markup=n(pr.markup);
    const breakEven=full/(1-fee||.05);
    const markupPrice=full*(1+markup/100)/(1-fee||.05),markupNet=markupPrice*(1-fee),markupMargin=(markupNet-full)/(markupPrice||Infinity);
    const raw=Math.max(breakEven,markupPrice),step=[10,50,100,500].includes(n(pr.round))?n(pr.round):100,recommended=Math.ceil(raw/step)*step;
    return {volume,annual,mats,labor,totalBuy,inventory,budgetTotal,budgetPer,base,work,extra,mainCost,workCost,extraCost,individual,quality,full,fee,markup,markupPrice,markupMargin,breakEven,raw,step,recommended};
  }
  function input(path,label,type='number',hint='') {const value=get(path);return `<label class="field"><span>${esc(label)}</span><input data-path="${esc(path)}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(value)}">${hint?`<small>${esc(hint)}</small>`:''}</label>`}
  function pricingInput(path,label,hint='',min=0,max=95,placeholder=''){const value=get(path);return `<label class="field"><span>${esc(label)}</span><input data-path="${esc(path)}" type="number" min="${min}" max="${max}" step="any" placeholder="${esc(placeholder)}" value="${esc(value)}">${hint?`<small>${esc(hint)}</small>`:''}</label>`}
  const simplePrice=(title,value,description,kind='')=>`<div class="field simple-price ${kind}"><span>${esc(title)}</span><div class="result ${kind==='recommended'?'emphasis':'auto'}"><b>${value}</b></div><small>${esc(description)}</small></div>`;
  function get(path){return path.split('.').reduce((o,k)=>o?.[k],state)??''}
  function set(path,value){const parts=path.split('.');let o=state;parts.slice(0,-1).forEach(k=>o=o[k]);o[parts.at(-1)]=value}
  const auto=(label,value)=>`<div class="field"><span>${esc(label)}</span><div class="result auto"><b>${value}</b></div></div>`;
  const remove=(kind,rowId)=>`<button class="btn secondary danger remove" data-remove="${kind}" data-id="${rowId}">Удалить</button>`;
  function materialCard(m,c,i){return `<article class="line-card material-card"><div class="material-card-head"><h4>Основной материал ${i+1}</h4>${remove('materials',m.id)}</div><div class="material-plane-wrap"><div class="material-plane">${input(`materials.${i}.name`,'Наименование','text')}${input(`materials.${i}.cost`,'Закупка за период, ₽')}${combo(`materials.${i}.qty`,`materials.${i}.unit`,'Куплено за период',m.unit)}${input(`materials.${i}.start`,'Остаток на начало')}${input(`materials.${i}.end`,'Остаток на конец')}<div class="material-result"><span>Стоимость единицы</span><div class="result auto"><b>${money(c.unitCost)}</b></div></div><div class="material-result"><span>Капитал в остатке</span><div class="result auto"><b>${money(c.capital)}</b></div></div></div></div></article>`}
  function combo(qPath,uPath,label,unit){return `<label class="field"><span>${esc(label)}</span><div class="unit-combo"><input data-path="${esc(qPath)}" type="number" min="0" step="any" value="${esc(get(qPath))}"><select data-path="${esc(uPath)}">${units.map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select></div></label>`}
  function usageCombo(qPath,uPath,label,purchaseUnit,usageUnit){const source=UNIT_META[purchaseUnit],available=units.filter(u=>UNIT_META[u]?.group===source?.group),selected=available.includes(usageUnit)?usageUnit:purchaseUnit;return `<label class="field"><span>${esc(label)}</span><div class="unit-combo"><input data-path="${esc(qPath)}" type="number" min="0" step="any" value="${esc(get(qPath))}"><select data-path="${esc(uPath)}">${available.map(u=>`<option ${u===selected?'selected':''}>${u}</option>`).join('')}</select></div></label>`}
  function laborCard(x,c){let i=state.labor.indexOf(x);return `<article class="line-card entity-card"><div class="entity-card-head"><h4>Сотрудник или операция</h4>${remove('labor',x.id)}</div><div class="entity-plane-wrap"><div class="entity-plane entity-plane-4">${input(`labor.${i}.name`,'Наименование','text')}${input(`labor.${i}.cost`,'Полная стоимость за период, ₽','number')}${input(`labor.${i}.hours`,'Производительные часы за период','number')}${auto('Стоимость производительного часа',money(c.hourCost))}</div></div></article>`}
  function budgetCard(x){let i=state.budgets.indexOf(x),per=n(x.amount)/(n(state.business.volume)||Infinity);return `<article class="line-card entity-card"><div class="entity-card-head"><h4>Бюджет периода</h4>${remove('budgets',x.id)}</div><div class="entity-plane-wrap"><div class="entity-plane entity-plane-4">${input(`budgets.${i}.name`,'Наименование','text')}<label class="field"><span>Категория</span><select data-path="budgets.${i}.category">${['Производственные расходы','Реклама и продажи','Управление и администрация','Другие расходы'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select></label>${input(`budgets.${i}.amount`,'Сумма за период, ₽')}${auto('Расход на одну единицу',money(per))}</div></div></article>`}
  function selectField(label,attr,options,value){return `<label class="field"><span>${esc(label)}</span><select ${attr}>${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`}
  function render(){const c=calc(),p=state.product,pr=state.pricing;
    reportEmbedData(c);
    const warns=[];if(!periodDays())warns.push('Выберите корректные даты: дата окончания должна быть не раньше даты начала.');if(!c.volume)warns.push('Укажите план продаж за период.');
    document.getElementById('calculator').innerHTML=`
    <section class="block"><h2>1. Базовая информация бизнеса</h2>
      <div class="sub"><h3>1.1. Период и стандартный объём</h3><div class="field"><span>Расчётный период</span><div class="period-range">${input('business.periodStart','С даты','date')}${input('business.periodEnd','По дату','date')}</div></div>${input('business.volume','План продаж за выбранный период, единиц','number')}${auto('Годовой стандартный объём',number(c.annual)+' ед.')}</div>
      <div class="sub"><h3>1.2. Основные материалы · ${state.materials.length}</h3>${state.materials.map((m,i)=>materialCard(m,c.mats[i],i)).join('')}${auto('Бюджет закупки материалов за период',money(c.totalBuy))}${auto('Средний капитал в запасах материалов',money(c.inventory))}<button class="btn secondary" data-add="materials">Добавить основной материал</button></div>
      <div class="sub"><h3>1.3. Сотрудники и операции</h3>${state.labor.map((x,i)=>laborCard(x,c.labor[i])).join('')}<button class="btn secondary" data-add="labor">Добавить сотрудника или операцию</button></div>
      <div class="sub"><h3>1.4. Общие бюджеты периода</h3>${state.budgets.map(budgetCard).join('')}${auto('Все общие бюджеты периода',money(c.budgetTotal))}${auto('Общие расходы на одну единицу',money(c.budgetPer),`${money(c.budgetTotal)} ÷ ${number(c.volume)} ед.`)}<button class="btn secondary" data-add="budgets">Добавить бюджет периода</button></div>
    </section>
    <section class="block"><h2>2. Себестоимость конкретного изделия или услуги</h2>
      <div class="sub"><h3>2.1. Паспорт расчёта</h3>${input('product.name','Наименование','text')}${selectField('Тип','data-path="product.type"',[['product','Изделие'],['service','Услуга']],p.type)}</div>
      <div class="sub"><h3>2.2. Основные материалы в единице</h3>${p.baseMaterials.map((x,i)=>baseMaterialCard(x,i,c.base[i],c.mats)).join('')}<button class="btn secondary" data-add="baseMaterials">Добавить материал из базы</button></div>
      <div class="sub"><h3>2.3. Работа над единицей</h3>${p.work.map((x,i)=>workCard(x,i,c.work[i],c.labor)).join('')}<button class="btn secondary" data-add="work">Добавить работу из базы</button></div>
      <div class="sub"><h3>2.4. Дополнительные материалы</h3>${p.extraMaterials.map((x,i)=>extraCard(x,i,c.extra[i])).join('')}<button class="btn secondary" data-add="extraMaterials">Добавить дополнительный материал</button></div>
      <div class="sub"><h3>2.5. Индивидуальные расходы</h3>${p.individual.map((x,i)=>individualCard(x,i)).join('')}<button class="btn secondary" data-add="individual">Добавить индивидуальный расход</button></div>
      <div class="sub"><h3>2.6. Ожидаемые потери качества</h3>${input('product.qualityLoss','Ожидаемая стоимость брака, переделок и возвратов на единицу, ₽','number')}</div>
      <div class="sub"><h3>2.7. Полная себестоимость</h3>${costBreakdown(c)}</div>
    </section>
    <section class="block"><h2>3. Какую цену установить</h2><p class="hint">Укажите желаемую наценку и обязательные удержания. Калькулятор рассчитает безопасную цену продажи.</p>
      <div class="sub"><h3>Что вы хотите получить</h3>${pricingInput('pricing.markup','Желаемая наценка на себестоимость, %','Наценка может быть 100%, 200% и выше.',0,999999999)}${pricingInput('pricing.fees','Комиссии и налоги с продажи','Например: налог, эквайринг, комиссия маркетплейса или посредника.',0,95)}<div class="field"><small>Если с продажи удерживается 6%, укажите 6.</small></div>${selectField('Округлять итоговую цену до','data-path="pricing.round"',[[10,'10 ₽'],[50,'50 ₽'],[100,'100 ₽'],[500,'500 ₽']],n(pr.round))}${pricingInput('pricing.actual','Цена, по которой вы хотите продавать','Поле можно оставить пустым. Оно нужно только для сравнения с расчётной ценой.',0,999999999,'Например, 5 000 ₽')}</div>
      <div class="sub"><h3>Результат расчёта</h3>${warns.map(x=>`<div class="notice">${esc(x)}</div>`).join('')}${simplePrice('Себестоимость одного изделия',money(c.full),'Изготовление одного изделия обходится в эту сумму.')}${simplePrice('Минимальная цена без убытка',money(c.breakEven),'Ниже этой цены продажа приносит убыток.')}${simplePrice('Цена с выбранной наценкой',money(c.markupPrice),'Цена с учётом вашей наценки и комиссий.')}${simplePrice('Маржа после комиссий',number(c.markupMargin*100)+'%','Доля цены, которая остаётся после комиссий и себестоимости.')}${simplePrice('Рекомендуемая цена продажи',money(c.recommended),'Самая высокая из обязательных цен, округлённая вверх.','recommended')}</div>
    </section>
    <section class="block"><h2>4. Проверка вашей цены</h2>
      <div class="sub"><h3>Сравнение с расчётной ценой</h3>${priceStatus(c)}</div>
      <div class="sub no-print"><h3>Сохранение и экспорт</h3><button class="btn" data-action="save">Сохранить в браузере</button><button class="btn secondary" data-action="json">Экспортировать JSON</button><button class="btn secondary" data-action="import">Импортировать JSON</button><button class="btn secondary" data-action="csv">Экспортировать CSV</button><button class="btn secondary" data-action="print">Печать</button><button class="btn secondary danger" data-action="reset">Сбросить расчёт</button></div>
    </section>`;
  }
  function baseMaterialCard(x,i,r,mats){const dimensions=r.isArea?`${input(`product.baseMaterials.${i}.width`,'Ширина, м')}${input(`product.baseMaterials.${i}.length`,'Длина, м')}`:usageCombo(`product.baseMaterials.${i}.usage`,`product.baseMaterials.${i}.usageUnit`,'Чистый расход на единицу',r.purchaseUnit,r.usageUnit),planeClass=r.isArea?'entity-plane-5':'entity-plane-4';return `<article class="line-card entity-card"><div class="entity-card-head"><h4>Материал из общей базы</h4>${remove('baseMaterials',x.id)}</div><div class="entity-plane-wrap"><div class="entity-plane ${planeClass}">${selectField('Материал',`data-base="${i}" data-key="materialId"`,[['','Выберите материал'],...state.materials.map(m=>[m.id,m.name||'Без названия'])],x.materialId)}${dimensions}${input(`product.baseMaterials.${i}.loss`,'Технологические потери, %')}${auto('Стоимость в изделии',money(r.value))}</div></div></article>`}
  function workCard(x,i,r){return `<article class="line-card entity-card"><div class="entity-card-head"><h4>Работа из общей базы</h4>${remove('work',x.id)}</div><div class="entity-plane-wrap"><div class="entity-plane entity-plane-3">${selectField('Сотрудник или операция',`data-work="${i}" data-key="laborId"`,[['','Выберите сотрудника'],...state.labor.map(l=>[l.id,l.name||'Без названия'])],x.laborId)}${input(`product.work.${i}.hours`,'Часы на единицу')}${auto('Стоимость работы',money(r.value))}</div></div></article>`}
  function extraCard(x,i,r){return `<article class="line-card entity-card"><div class="entity-card-head"><h4>Дополнительный материал</h4>${remove('extraMaterials',x.id)}</div><div class="entity-plane-wrap"><div class="entity-plane entity-plane-6">${input(`product.extraMaterials.${i}.name`,'Наименование','text')}${input(`product.extraMaterials.${i}.cost`,'Общая стоимость покупки, ₽')}${combo(`product.extraMaterials.${i}.qty`,`product.extraMaterials.${i}.unit`,'Купленное количество',x.unit)}${usageCombo(`product.extraMaterials.${i}.usage`,`product.extraMaterials.${i}.usageUnit`,'Чистый расход на единицу',x.unit,r.usageUnit)}${input(`product.extraMaterials.${i}.loss`,'Потери, %')}${auto('Стоимость в изделии',money(r.value))}</div></div></article>`}
  function individualCard(x,i){return `<article class="line-card entity-card"><div class="entity-card-head"><h4>Индивидуальный расход</h4>${remove('individual',x.id)}</div><div class="entity-plane-wrap"><div class="entity-plane entity-plane-3">${input(`product.individual.${i}.name`,'Наименование','text')}${input(`product.individual.${i}.amount`,'Стоимость на одну единицу, ₽')}${auto('Расход на одну единицу',money(n(x.amount)))}</div></div></article>`}
  function costBreakdown(c){return [['Основные материалы',c.mainCost],['Работа',c.workCost],['Общие бюджеты на единицу',c.budgetPer],['Дополнительные материалы',c.extraCost],['Индивидуальные расходы',c.individual],['Ожидаемые потери качества',c.quality]].map(([x,v])=>`<div class="metric"><span>${x}</span><strong>${money(v)}</strong></div>`).join('')+`<div class="result emphasis"><b>Полная операционная себестоимость: ${money(c.full)}</b></div>`}
  function priceStatus(c){if(!c.recommended)return '<div class="status bad">Укажите себестоимость и проверьте комиссии: расчётная цена пока невозможна.</div>';let actual=n(state.pricing.actual);if(!actual)return `<div class="status">Используется рекомендуемая цена: ${money(c.recommended)}.</div>`;let diff=actual-c.recommended;return diff>=0?`<div class="status">Ваша цена подходит. Она выше рекомендуемой на ${money(diff)}.</div>`:`<div class="status bad">Ваша цена слишком низкая. До рекомендуемой цены не хватает ${money(-diff)}.</div>`}
  function add(kind){const maps={materials:{id:id('m'),name:'',cost:0,qty:0,unit:'шт.',start:0,end:0},labor:{id:id('l'),name:'',cost:0,hours:0},budgets:{id:id('b'),name:'',category:'Производственные расходы',amount:0},baseMaterials:{id:id('bm'),materialId:'',width:0,length:0,usage:0,usageUnit:'шт.',loss:0},work:{id:id('w'),laborId:'',hours:0},extraMaterials:{id:id('em'),name:'',cost:0,qty:0,unit:'шт.',usage:0,usageUnit:'шт.',loss:0},individual:{id:id('i'),name:'',amount:0}};const target=['baseMaterials','work','extraMaterials','individual'].includes(kind)?state.product[kind]:state[kind];target.push(maps[kind]);save();render()}
  function removeItem(kind,rowId){const target=['baseMaterials','work','extraMaterials','individual'].includes(kind)?state.product[kind]:state[kind];const i=target.findIndex(x=>x.id===rowId);if(i>=0)target.splice(i,1);save();render()}
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
  function csv(c){const rows=[['Наименование изделия',state.product.name],['Период с',state.business.periodStart],['Период по',state.business.periodEnd],['Дней в периоде',periodDays()],['Стандартный объём за период',c.volume],['Закупка материалов за период',c.totalBuy],['Средний капитал в запасах',c.inventory],['Общие бюджеты периода',c.budgetTotal],['Основные материалы на единицу',c.mainCost],['Работа на единицу',c.workCost],['Общие бюджеты на единицу',c.budgetPer],['Дополнительные материалы',c.extraCost],['Индивидуальные расходы',c.individual],['Потери качества',c.quality],['Полная себестоимость',c.full],['Желаемая наценка',c.markup],['Маржа после комиссий',c.markupMargin],['Цена без убытка',c.breakEven],['Цена с наценкой',c.markupPrice],['Финальная рекомендуемая цена',c.recommended]];return '\ufeffПоказатель;Значение\r\n'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n')}
  document.addEventListener('input',e=>{if(!e.target.dataset.path)return;set(e.target.dataset.path,e.target.type==='number'?n(e.target.value):e.target.value);save()});
  document.addEventListener('change',e=>{if(e.target.dataset.path!==undefined){let value=e.target.type==='number'?n(e.target.value):e.target.value;if(e.target.type==='number'&&e.target.max){const max=Number(e.target.max);if(Number.isFinite(max))value=Math.min(value,max)}if(e.target.type==='number'&&e.target.min){const min=Number(e.target.min);if(Number.isFinite(min))value=Math.max(value,min)}set(e.target.dataset.path,value);if(String(e.target.dataset.path).startsWith('pricing.'))ensurePricing();save();render();return}if(e.target.dataset.base!==undefined){state.product.baseMaterials[n(e.target.dataset.base)][e.target.dataset.key]=e.target.value;save();render()}if(e.target.dataset.work!==undefined){state.product.work[n(e.target.dataset.work)][e.target.dataset.key]=e.target.value;save();render()}});
  document.addEventListener('click',e=>{let b=e.target.closest('[data-add],[data-remove],[data-action]');if(!b)return;if(b.dataset.add)add(b.dataset.add);if(b.dataset.remove)removeItem(b.dataset.remove,b.dataset.id);if(b.dataset.action){let a=b.dataset.action,c=calc();if(a==='save'){save();b.textContent='Сохранено';setTimeout(()=>b.textContent='Сохранить в браузере',1000)}if(a==='json')download('price-calculator.json',JSON.stringify(state,null,2),'application/json');if(a==='import')document.getElementById('importFile').click();if(a==='csv')download('price-calculator.csv',csv(c),'text/csv;charset=utf-8');if(a==='print')window.print();if(a==='reset'){state=clone(demo);save();render()}}});
  document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const x=JSON.parse(r.result);if(!valid(x))throw Error();state=x;ensurePeriodRange();ensurePricing();save();render()}catch{alert('Не удалось импортировать файл: нужна корректная JSON-копия этого калькулятора.')}e.target.value=''};r.readAsText(f)});
  render();
  reportEmbedHeight();
})();
</script>
