<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конкуренты и поисковый запрос — демонстрация</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #211e1b; background: #f5f3ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(20px, 4vw, 48px); }
    main { max-width: 920px; margin: 0 auto; }
    .eyebrow { margin: 0 0 12px; color: #716a62; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 38px); letter-spacing: -.035em; }
    .intro { margin: 0 0 28px; color: #655f58; line-height: 1.5; }
    .panel { padding: clamp(20px, 3vw, 32px); border: 1px solid #ded8d0; border-radius: 20px; background: #fff; }
    .query-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; padding-bottom: 24px; border-bottom: 1px solid #ded8d0; }
    .label { display: block; margin-bottom: 8px; color: #716a62; font-size: 13px; font-weight: 650; }
    .query { margin: 0; font-size: clamp(21px, 3vw, 27px); font-weight: 750; overflow-wrap: anywhere; }
    .query-nav { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .query-nav span { padding: 0 5px; color: #655f58; font-size: 13px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #25211e; outline-offset: 3px; }
    .nav-button { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #d9d2c8; border-radius: 11px; background: #fff; font-size: 21px; }
    .nav-button:disabled { opacity: .35; cursor: default; }
    .list-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; padding: 22px 0 12px; }
    h2 { margin: 0; font-size: 19px; }
    .count { margin: 0; color: #655f58; font-size: 14px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 185px) auto; gap: 12px 18px; align-items: center; min-height: 86px; padding: 16px 0; border-top: 1px solid #e8e2da; }
    .identity { min-width: 0; }
    .identity strong { display: block; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
    .identity small { display: block; margin-top: 4px; color: #716a62; font-size: 13px; overflow-wrap: anywhere; }
    .state { color: #5f5952; font-size: 14px; line-height: 1.35; }
    .action { min-height: 42px; padding: 9px 14px; border: 1px solid #d9d2c8; border-radius: 10px; background: #fff; color: #211e1b; font-size: 14px; font-weight: 650; white-space: nowrap; }
    .action:hover, .nav-button:not(:disabled):hover { background: #f5f3ef; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 20px; border-top: 1px solid #ded8d0; }
    .footer p { margin: 0; color: #716a62; font-size: 13px; line-height: 1.4; }
    .finish { min-height: 42px; padding: 9px 16px; border: 1px solid #2e2924; border-radius: 10px; background: #2e2924; color: #fff; font-size: 14px; font-weight: 650; white-space: nowrap; }
    .finish:disabled { opacity: .45; cursor: default; }
    .note { margin: 18px 0 0; color: #716a62; font-size: 13px; line-height: 1.5; }
    @media (max-width: 700px) {
      .query-head { grid-template-columns: 1fr; }
      .query-nav { justify-content: flex-start; }
      .row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
      .state { grid-column: 1 / -1; grid-row: 2; }
      .action { grid-column: 2; grid-row: 1; white-space: normal; max-width: 170px; }
      .footer { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 440px) {
      .row { grid-template-columns: 1fr; }
      .state, .action { grid-column: 1; grid-row: auto; }
      .action { max-width: none; width: fit-content; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Демонстрация взаимодействия</p>
    <h1>Конкуренты по запросу</h1>
    <p class="intro">Связь с каждым поисковым запросом отмечается одним действием. Конкурент остаётся в общем сравнении.</p>
    <section class="panel" aria-label="Поиск конкурентов">
      <div class="query-head">
        <div><span class="label">Текущий поисковый запрос</span><p class="query" id="query"></p></div>
        <div class="query-nav"><button class="nav-button" id="prev" aria-label="Предыдущий запрос">‹</button><span id="position"></span><button class="nav-button" id="next" aria-label="Следующий запрос">›</button></div>
      </div>
      <div class="list-head"><h2>Конкуренты в сравнении · 3</h2><p class="count" id="count" aria-live="polite"></p></div>
      <div id="rows"></div>
      <div class="footer"><p id="progress" aria-live="polite"></p><button class="finish" id="finish">Завершить поиск по запросу</button></div>
    </section>
    <p class="note">Это отдельный интерактивный макет. Он ничего не записывает в проект.</p>
  </main>
  <script>
    const queries = ["шапка коза", "новогодняя шапка коза", "шапка символ 2027 года"];
    const competitors = [
      { id: "lanta", name: "Шапочка Козлика", domain: "lanta.biz" },
      { id: "livemaster", name: 'Шапка "Коза". Символ Нового Года', domain: "livemaster.ru" },
      { id: "ozon", name: "Новогодняя шапка для взрослых и детей", domain: "ozon.ru" },
    ];
    const found = new Map(queries.map((_, index) => [index, new Set(index === 0 ? competitors.map(row => row.id) : [])]));
    const finished = new Set();
    let current = 0;
    const $ = (id) => document.getElementById(id);
    const rowNodes = new Map();
    for (const competitor of competitors) {
      const row = document.createElement("div");
      row.className = "row";
      const identity = document.createElement("div");
      identity.className = "identity";
      const name = document.createElement("strong");
      const domain = document.createElement("small");
      name.textContent = competitor.name;
      domain.textContent = competitor.domain;
      identity.append(name, domain);
      const state = document.createElement("span");
      state.className = "state";
      const action = document.createElement("button");
      action.className = "action";
      action.type = "button";
      action.addEventListener("click", () => {
        const selected = found.get(current);
        if (selected.has(competitor.id)) selected.delete(competitor.id);
        else selected.add(competitor.id);
        refresh();
        action.focus();
      });
      row.append(identity, state, action);
      $("rows").append(row);
      rowNodes.set(competitor.id, { state, action });
    }
    function refresh() {
      $("query").textContent = queries[current];
      $("position").textContent = `Запрос ${current + 1} из ${queries.length}`;
      $("prev").disabled = current === 0;
      $("next").disabled = current === queries.length - 1;
      const selected = found.get(current);
      $("count").textContent = `Найдено по запросу: ${selected.size}`;
      for (const competitor of competitors) {
        const { state, action } = rowNodes.get(competitor.id);
        const isFound = selected.has(competitor.id);
        state.textContent = isFound ? "Найден по запросу" : finished.has(current) ? "Не найден по запросу" : "Пока не отмечен";
        action.textContent = isFound ? "Убрать из найденных" : "Отметить найденным";
        action.setAttribute("aria-label", `${action.textContent}: ${competitor.name}, запрос «${queries[current]}»`);
      }
      $("progress").textContent = finished.has(current) ? "Поиск по запросу завершён" : "Отметьте найденных конкурентов, затем завершите поиск.";
      $("finish").disabled = finished.has(current);
    }
    $("prev").addEventListener("click", () => { if (current > 0) { current -= 1; refresh(); } });
    $("next").addEventListener("click", () => { if (current < queries.length - 1) { current += 1; refresh(); } });
    $("finish").addEventListener("click", () => { finished.add(current); refresh(); });
    refresh();
  </script>
</body>
</html>
